name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-amd64
            cgo: '0'

          - os: ubuntu-22.04
            target: linux-amd64
            cgo: '1'

    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFLAGS: -mod=readonly
      # A tag build knows its version, which turns on its updates
      # (internal/update); other builds are development builds.
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Gio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            pkg-config \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libvulkan-dev

      # go.mod replaces go-text with the patched copy this builds.
      - name: Apply dependency patches
        run: sh patches/apply.sh

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)

          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build all packages
        run: go build ./...

      # =========================
      # Windows
      # =========================

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin/dist | Out-Null

          go build `
            -trimpath `
            -ldflags "-s -w -H=windowsgui -X main.version=$env:VERSION" `
            -o bin/dist/WhatsUpClients-windows-amd64.exe `
            ./cmd/whatsup

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: bin/dist/WhatsUpClients-windows-amd64.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          # Inno Setup wants a plain number; development builds are 0.0.0.
          $ver = if ($env:VERSION) { $env:VERSION.TrimStart('v') } else { '0.0.0' }

          & $iscc /Qp "/DAppVersion=$ver" installer/whatsup.iss

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: bin/dist/WhatsUpClients-Setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      # =========================
      # Linux
      # =========================

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin/dist

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o bin/dist/WhatsUpClients-linux-amd64 \
            ./cmd/whatsup

          chmod +x bin/dist/WhatsUpClients-linux-amd64

      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: bin/dist/WhatsUpClients-linux-amd64
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    needs: build

    runs-on: ubuntu-22.04

    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: WhatsUpClients-windows-amd64.exe
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: WhatsUpClients-Setup.exe
          path: dist

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: WhatsUpClients-linux-amd64
          path: dist

      - name: Show downloaded files
        run: |
          ls -lah dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum \
            WhatsUpClients-windows-amd64.exe \
            WhatsUpClients-Setup.exe \
            WhatsUpClients-linux-amd64 \
            > SHA256SUMS

          sha256sum --check SHA256SUMS

      # The app only installs updates whose SHA256SUMS this key signed
      # (internal/update). signrelease uses only the standard library, so
      # it builds as a module of its own, without the patched go-text.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo 'The RELEASE_SIGNING_KEY secret is missing; see docs/releasing.md.' >&2
            exit 1
          fi

          sign="$RUNNER_TEMP/signrelease"
          mkdir -p "$sign"
          cp cmd/signrelease/main.go "$sign/"
          cd "$sign"
          go mod init signrelease
          sign_out=$(go run . "$GITHUB_WORKSPACE/dist/SHA256SUMS")
          echo "$sign_out"
          # The secret must be the seed matching the public key the app
          # trusts. A public key pasted by mistake is also 32 bytes of
          # base64, so it signs fine but no released app would accept it.
          signed_pub=$(printf '%s\n' "$sign_out" | sed -n 's/.*with public key //p')
          code_pub=$(sed -n 's/^[[:space:]]*var publicKey = mustKey("\([^"]*\)").*/\1/p' "$GITHUB_WORKSPACE/internal/update/update.go")
          if [ -z "$signed_pub" ] || [ "$signed_pub" != "$code_pub" ]; then
            echo "RELEASE_SIGNING_KEY does not match internal/update's publicKey ($code_pub)." >&2
            exit 1
          fi

      # The release notes come from CHANGELOG.md: the section headed
      # "## [vX.Y.Z]" is published verbatim as the release body, so a
      # release without a changelog entry fails here instead of shipping
      # empty notes.
      - name: Extract release notes
        run: |
          awk -v ver="${{ github.ref_name }}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/release_notes.md
          if [ ! -s dist/release_notes.md ]; then
            echo "CHANGELOG.md has no section for ${{ github.ref_name }}" >&2
            exit 1
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}

        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then

            if [ "$draft" != 'true' ]; then
              echo 'Release already published; refusing to replace its assets.' >&2
              exit 1
            fi

            gh release upload "$RELEASE_TAG" \
              dist/WhatsUpClients-windows-amd64.exe \
              dist/WhatsUpClients-Setup.exe \
              dist/WhatsUpClients-linux-amd64 \
              dist/SHA256SUMS \
              dist/SHA256SUMS.sig \
              --clobber

          else

            gh release create "$RELEASE_TAG" \
              dist/WhatsUpClients-windows-amd64.exe \
              dist/WhatsUpClients-Setup.exe \
              dist/WhatsUpClients-linux-amd64 \
              dist/SHA256SUMS \
              dist/SHA256SUMS.sig \
              --verify-tag \
              --notes-file dist/release_notes.md \
              --title "WhatsUpClients $RELEASE_TAG"

          fi